[package]
name = "tokioop"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_tokioop"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
crossbeam-queue = "0.3"
libc = "0.2"
